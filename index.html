<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050816">
  <title>Toploader</title>
  <style>
    :root {
      --bg: #050816;
      --panel: rgba(16, 26, 50, 0.86);
      --line: rgba(148, 163, 184, 0.18);
      --text: #eef4ff;
      --muted: #95a4bc;
      --ok: #2dd4bf;
      --warn: #f7c76d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 72% 0%, rgba(139, 92, 246, 0.20), transparent 34%),
        radial-gradient(circle at 12% 0%, rgba(45, 212, 191, 0.12), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px 12px 32px;
    }
    header { margin-bottom: 12px; }
    h1 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: -0.04em;
    }
    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .tab {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .tab.active {
      background: linear-gradient(145deg, rgba(139, 92, 246, 0.35), rgba(45, 212, 191, 0.12));
      color: var(--text);
      border-color: rgba(139, 92, 246, 0.45);
    }
    .hero {
      border: 1px solid rgba(139, 92, 246, 0.34);
      background:
        linear-gradient(145deg, rgba(139, 92, 246, 0.28), rgba(45, 212, 191, 0.10)),
        var(--panel);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.30);
      margin-bottom: 12px;
    }
    .hero h2 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      letter-spacing: -0.04em;
    }
    .hero p {
      margin: 0;
      color: #c8d5ff;
      line-height: 1.45;
    }
    .home-grid, .summary-grid {
      display: grid;
      gap: 8px;
    }
    .summary-grid {
      grid-template-columns: repeat(3, 1fr);
      margin: 12px 0;
    }
    .summary {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 12px;
    }
    .summary strong {
      display: block;
      font-size: 1.25rem;
    }
    .summary span {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .action-card {
      text-align: left;
      cursor: pointer;
      color: inherit;
      font: inherit;
      width: 100%;
    }
    .action-card h2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .action-card h2 span {
      color: var(--ok);
      font-size: 1.1rem;
    }
    .toolbar {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: linear-gradient(var(--bg) 70%, transparent);
      padding-bottom: 8px;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      padding: 10px 12px;
      font-size: 1rem;
    }
    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .filters.wishlist-filters {
      grid-template-columns: 1fr 1fr;
    }
    .stats {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0;
    }
    .list {
      display: grid;
      gap: 8px;
    }
    .card, .action-card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 18px 52px rgba(0, 0, 0, 0.22);
    }
    .card h2, .action-card h2 {
      margin: 0 0 4px;
      font-size: 1rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 8px;
    }
    .prices, .budget {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .price, .budget { min-width: 88px; }
    .price .label, .budget .label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .price .value {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .budget .value {
      color: var(--ok);
      font-weight: 800;
      font-size: 1.05rem;
    }
    .why {
      font-size: 0.82rem;
      color: #c8d5ff;
      line-height: 1.35;
    }
    .badge {
      display: inline-block;
      border: 1px solid #31518f;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.72rem;
      margin-right: 6px;
      color: #c9d7ff;
    }
    .badge.watch { border-color: #8a6a2a; color: var(--warn); }
    .empty, .error {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 16px;
      color: var(--muted);
      text-align: center;
    }
    .error { color: #ff9a9a; }
    @media (min-width: 720px) {
      body {
        max-width: 780px;
        margin: 0 auto;
        padding-top: 24px;
      }
      .home-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Toploader</h1>
    <p class="meta" id="meta">Loading snapshot…</p>
  </header>

  <nav class="tabs" aria-label="View">
    <button type="button" class="tab active" id="tabHome" data-view="home">Home</button>
    <button type="button" class="tab" id="tabFloors" data-view="floors">Floors</button>
    <button type="button" class="tab" id="tabWishlist" data-view="wishlist">Wishlist</button>
  </nav>

  <div id="viewHome" class="view active">
    <section class="hero">
      <h2>Card-show helper in your pocket</h2>
      <p>Check today’s floor prices, target buys, and the family wishlist from the same phone-friendly Toploader page.</p>
    </section>
    <div class="summary-grid" aria-label="Snapshot summary">
      <div class="summary"><strong id="homeCardCount">—</strong><span>priced cards</span></div>
      <div class="summary"><strong id="homeWishlistCount">—</strong><span>wishlist</span></div>
      <div class="summary"><strong id="homeWatchCount">—</strong><span>watch flags</span></div>
    </div>
    <div class="home-grid">
      <button type="button" class="action-card" data-go="floors">
        <h2>Floor checker <span>›</span></h2>
        <p class="sub">Search every exported card, compare floor and target buy, and spot pricing quality flags.</p>
      </button>
      <button type="button" class="action-card" data-go="wishlist">
        <h2>Wishlist <span>›</span></h2>
        <p class="sub">A cleaner share link for family and friends, showing only watched cards and target prices.</p>
      </button>
    </div>
    <div id="homeError"></div>
  </div>

  <div id="viewFloors" class="view">
    <div class="toolbar">
      <input type="search" id="searchFloors" placeholder="Search card, number, set…" autocomplete="off">
      <div class="filters">
        <select id="setFilterFloors" aria-label="Filter by set">
          <option value="">All sets</option>
        </select>
        <select id="qualityFilterFloors" aria-label="Filter by quality flag">
          <option value="">All quality</option>
          <option value="watch">Quality: watch only</option>
        </select>
      </div>
      <p class="stats" id="statsFloors"></p>
    </div>
    <div id="listFloors" class="list"></div>
  </div>

  <div id="viewWishlist" class="view">
    <div class="toolbar">
      <input type="search" id="searchWishlist" placeholder="Search card, number, set…" autocomplete="off">
      <div class="filters wishlist-filters">
        <select id="setFilterWishlist" aria-label="Filter by set">
          <option value="">All sets</option>
        </select>
        <select id="sortWishlist" aria-label="Sort wishlist">
          <option value="cheapest">Cheapest first</option>
          <option value="expensive">Most expensive first</option>
          <option value="set">Set order</option>
        </select>
      </div>
      <p class="stats" id="statsWishlist"></p>
    </div>
    <div id="listWishlist" class="list"></div>
  </div>

  <script>
    const CACHE_KEY = "toploader_floors_v1";

    function money(v) {
      if (v === null || v === undefined || v === "") return "n/a";
      const n = Number(v);
      if (!Number.isFinite(n)) return "n/a";
      return "£" + n.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function moneyWishlist(v) {
      if (v === null || v === undefined || v === "") return "Ask me";
      const n = Number(v);
      if (!Number.isFinite(n)) return "Ask me";
      return "£" + n.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function isWatched(card) {
      return Number(card.watchlist_status) === 1;
    }

    function loadCached() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (_) {
        return null;
      }
    }

    function saveCache(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      } catch (_) {}
    }

    async function loadSnapshot() {
      try {
        const res = await fetch("floors.json?" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        saveCache(data);
        return data;
      } catch (err) {
        const cached = loadCached();
        if (cached) {
          cached._from_cache = true;
          cached._load_error = String(err);
          return cached;
        }
        throw err;
      }
    }

    let snapshotData = null;
    let activeView = "home";

    function setView(view) {
      activeView = view;
      const hash = view === "wishlist" ? "#wishlist" : view === "floors" ? "#floors" : "";
      if (location.hash !== hash) {
        history.replaceState(null, "", hash ? hash : location.pathname);
      }
      document.getElementById("viewHome").classList.toggle("active", view === "home");
      document.getElementById("viewFloors").classList.toggle("active", view === "floors");
      document.getElementById("viewWishlist").classList.toggle("active", view === "wishlist");
      document.getElementById("tabHome").classList.toggle("active", view === "home");
      document.getElementById("tabFloors").classList.toggle("active", view === "floors");
      document.getElementById("tabWishlist").classList.toggle("active", view === "wishlist");
      document.title = view === "wishlist" ? "Toploader — Wishlist" : view === "floors" ? "Toploader — Floors" : "Toploader";
      if (snapshotData) updateMeta();
      if (view === "home") renderHome();
      else if (view === "floors") renderFloors();
      else renderWishlist();
    }

    function parseHash() {
      const h = (location.hash || "").toLowerCase();
      if (h === "#floors") return "floors";
      return h === "#wishlist" ? "wishlist" : "home";
    }

    function updateMeta() {
      const when = snapshotData.generated_at_utc || snapshotData.local_date || "";
      const cacheNote = snapshotData._from_cache ? " · offline cache" : "";
      const errNote = snapshotData._load_error ? " · fetch issue" : "";
      const all = snapshotData.cards || [];
      const wish = all.filter(isWatched);
      if (activeView === "home") {
        document.getElementById("meta").textContent =
          `${all.length} cards · ${wish.length} on wishlist · updated ${when}${cacheNote}${errNote}`;
      } else if (activeView === "wishlist") {
        document.getElementById("meta").textContent =
          `${wish.length} wishlist cards · updated ${when}${cacheNote}${errNote}`;
      } else {
        document.getElementById("meta").textContent =
          `${all.length} cards · ${wish.length} on wishlist · ${when}${cacheNote}${errNote}`;
      }
    }

    function fillSetOptions(selectEl, cards) {
      const sets = [...new Set(cards.map(c => c.set_name).filter(Boolean))].sort();
      const prev = selectEl.value;
      selectEl.innerHTML = '<option value="">All sets</option>' +
        sets.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
      if (prev && sets.includes(prev)) selectEl.value = prev;
    }

    function renderHome() {
      const cards = snapshotData.cards || [];
      const wish = cards.filter(isWatched);
      const watchFlags = cards.filter(c => (c.floor_quality_flag || "").toLowerCase() === "watch");
      document.getElementById("homeCardCount").textContent = cards.length;
      document.getElementById("homeWishlistCount").textContent = wish.length;
      document.getElementById("homeWatchCount").textContent = watchFlags.length;
    }

    function renderFloors() {
      const cards = snapshotData.cards || [];
      fillSetOptions(document.getElementById("setFilterFloors"), cards);

      function apply() {
        const q = document.getElementById("searchFloors").value.trim().toLowerCase();
        const setVal = document.getElementById("setFilterFloors").value;
        const qual = document.getElementById("qualityFilterFloors").value;
        let filtered = cards.slice();
        if (setVal) filtered = filtered.filter(c => c.set_name === setVal);
        if (qual === "watch") {
          filtered = filtered.filter(c => (c.floor_quality_flag || "").toLowerCase() === "watch");
        }
        if (q) {
          filtered = filtered.filter(c => {
            const blob = [c.card, c.number, c.set_name, c.scrape_query, c.advisor_decision].join(" ").toLowerCase();
            return blob.includes(q);
          });
        }
        document.getElementById("statsFloors").textContent =
          `Showing ${filtered.length} of ${cards.length}`;
        const list = document.getElementById("listFloors");
        if (!filtered.length) {
          list.innerHTML = '<div class="empty">No cards match your filters.</div>';
          return;
        }
        list.innerHTML = filtered.map(card => {
          const qf = (card.floor_quality_flag || "").toLowerCase();
          const badgeClass = qf === "watch" ? "badge watch" : "badge";
          const onList = isWatched(card) ? '<span class="badge">On wishlist</span>' : "";
          return `
            <article class="card">
              <h2>${escapeHtml(card.card || "")} <span style="color:var(--muted)">#${escapeHtml(card.number || "")}</span></h2>
              <p class="sub">${escapeHtml(card.set_name || "")} · ${escapeHtml(card.advisor_decision || "—")}</p>
              <div class="prices">
                <div class="price"><span class="label">Floor</span><span class="value">${money(card.floor_gbp)}</span></div>
                <div class="price"><span class="label">Target buy</span><span class="value">${money(card.target_buy_gbp)}</span></div>
              </div>
              <p>
                ${onList}
                ${qf ? `<span class="${badgeClass}">${escapeHtml(card.floor_quality_flag)}</span>` : ""}
                ${card.floor_confidence ? `<span class="badge">${escapeHtml(card.floor_confidence)}</span>` : ""}
              </p>
              <p class="why">${escapeHtml(card.floor_justification || card.card_show_price_note || "")}</p>
            </article>
          `;
        }).join("");
      }

      document.getElementById("searchFloors").oninput = apply;
      document.getElementById("setFilterFloors").onchange = apply;
      document.getElementById("qualityFilterFloors").onchange = apply;
      apply();
    }

    function priceValue(card) {
      const n = Number(card.target_buy_gbp);
      return Number.isFinite(n) ? n : Number.POSITIVE_INFINITY;
    }

    function cardNumberValue(card) {
      const n = Number.parseInt(card.number, 10);
      return Number.isFinite(n) ? n : 9999;
    }

    function renderWishlist() {
      const cards = (snapshotData.cards || []).filter(isWatched);
      fillSetOptions(document.getElementById("setFilterWishlist"), cards);

      function apply() {
        const q = document.getElementById("searchWishlist").value.trim().toLowerCase();
        const setVal = document.getElementById("setFilterWishlist").value;
        const sortVal = document.getElementById("sortWishlist").value;
        let filtered = cards.slice();
        if (setVal) filtered = filtered.filter(c => c.set_name === setVal);
        if (q) {
          filtered = filtered.filter(c => {
            const blob = [c.card, c.number, c.set_name, c.scrape_query].join(" ").toLowerCase();
            return blob.includes(q);
          });
        }
        filtered.sort((a, b) => {
          if (sortVal === "expensive") return priceValue(b) - priceValue(a);
          if (sortVal === "set") {
            return String(a.set_name || "").localeCompare(String(b.set_name || ""))
              || cardNumberValue(a) - cardNumberValue(b)
              || String(a.card || "").localeCompare(String(b.card || ""));
          }
          return priceValue(a) - priceValue(b);
        });
        document.getElementById("statsWishlist").textContent =
          `Showing ${filtered.length} of ${cards.length}`;
        const list = document.getElementById("listWishlist");
        if (!filtered.length) {
          list.innerHTML = cards.length
            ? '<div class="empty">No wishlist cards match that search.</div>'
            : '<div class="empty">No watched cards in this snapshot. Toggle cards on the wishlist in the Toploader app, then run export and publish.</div>';
          return;
        }
        list.innerHTML = filtered.map(card => `
          <article class="card">
            <h2>${escapeHtml(card.card || "")} <span style="color:var(--muted)">#${escapeHtml(card.number || "")}</span></h2>
            <p class="sub">${escapeHtml(card.set_name || "")}</p>
            <div class="budget">
              <span class="label">Target price</span>
              <span class="value">${moneyWishlist(card.target_buy_gbp)}</span>
            </div>
          </article>
        `).join("");
      }

      document.getElementById("searchWishlist").oninput = apply;
      document.getElementById("setFilterWishlist").onchange = apply;
      document.getElementById("sortWishlist").onchange = apply;
      apply();
    }

    document.getElementById("tabHome").addEventListener("click", () => setView("home"));
    document.getElementById("tabFloors").addEventListener("click", () => setView("floors"));
    document.getElementById("tabWishlist").addEventListener("click", () => setView("wishlist"));
    document.querySelectorAll("[data-go]").forEach(el => {
      el.addEventListener("click", () => setView(el.dataset.go));
    });
    window.addEventListener("hashchange", () => setView(parseHash()));

    loadSnapshot()
      .then(data => {
        snapshotData = data;
        setView(parseHash());
      })
      .catch(err => {
        document.getElementById("meta").textContent = "Could not load floors.json";
        document.getElementById("homeError").innerHTML =
          `<div class="error">${escapeHtml(err.message || err)}<br><br>Run the morning batch with export on your laptop first.</div>`;
        document.getElementById("listFloors").innerHTML =
          `<div class="error">${escapeHtml(err.message || err)}<br><br>Run the morning batch with export on your laptop first.</div>`;
      });
  </script>
</body>
</html>
