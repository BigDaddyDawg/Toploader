<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b17">
  <title>Toploader — Daily Floors</title>
  <style>
    :root {
      --bg: #070b17;
      --panel: #111c38;
      --line: #2a3f75;
      --text: #e9eeff;
      --muted: #99a8d7;
      --brand: #5e8fff;
      --ok: #5ce3c3;
      --warn: #ffd07a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px 12px 32px;
    }
    header {
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
    }
    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .toolbar {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: linear-gradient(var(--bg) 70%, transparent);
      padding-bottom: 8px;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #172a53;
      color: var(--text);
      padding: 10px 12px;
      font-size: 1rem;
    }
    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stats {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .list {
      display: grid;
      gap: 8px;
    }
    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      padding: 12px;
    }
    .card h2 {
      margin: 0 0 4px;
      font-size: 1rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 8px;
    }
    .prices {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .price {
      min-width: 88px;
    }
    .price .label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .price .value {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .why {
      font-size: 0.82rem;
      color: #c8d5ff;
      line-height: 1.35;
    }
    .badge {
      display: inline-block;
      border: 1px solid #31518f;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.72rem;
      margin-right: 6px;
      color: #c9d7ff;
    }
    .badge.watch { border-color: #8a6a2a; color: var(--warn); }
    .empty, .error {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 16px;
      color: var(--muted);
      text-align: center;
    }
    .error { color: #ff9a9a; }
  </style>
</head>
<body>
  <header>
    <h1>Toploader — Daily Floors</h1>
    <p class="meta" id="meta">Loading snapshot…</p>
    <p class="meta"><a href="./wishlist.html" style="color: var(--ok); font-weight: 700;">Shareable wishlist</a></p>
  </header>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search card, number, set…" autocomplete="off">
    <div class="filters">
      <select id="setFilter" aria-label="Filter by set">
        <option value="">All sets</option>
      </select>
      <select id="qualityFilter" aria-label="Filter by quality">
        <option value="">All quality</option>
        <option value="watch">Watch only</option>
      </select>
    </div>
    <p class="stats" id="stats"></p>
  </div>

  <div id="list" class="list"></div>

  <script>
    const CACHE_KEY = "toploader_floors_v1";

    function money(v) {
      if (v === null || v === undefined || v === "") return "n/a";
      const n = Number(v);
      if (!Number.isFinite(n)) return "n/a";
      return "£" + n.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function loadCached() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (_) {
        return null;
      }
    }

    function saveCache(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      } catch (_) {}
    }

    async function loadSnapshot() {
      try {
        const res = await fetch("floors.json?" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        saveCache(data);
        return data;
      } catch (err) {
        const cached = loadCached();
        if (cached) {
          cached._from_cache = true;
          cached._load_error = String(err);
          return cached;
        }
        throw err;
      }
    }

    function render(data) {
      const cards = data.cards || [];
      const meta = document.getElementById("meta");
      const when = data.generated_at_utc || data.local_date || "unknown";
      const cacheNote = data._from_cache ? " (offline cache)" : "";
      const errNote = data._load_error ? " — live fetch failed: " + data._load_error : "";
      meta.textContent =
        `Snapshot ${data.local_date || ""} · ${cards.length} cards · updated ${when}${cacheNote}${errNote}`;

      const setFilter = document.getElementById("setFilter");
      const sets = data.sets || [...new Set(cards.map(c => c.set_name).filter(Boolean))];
      const prevSet = setFilter.value;
      setFilter.innerHTML = '<option value="">All sets</option>' +
        sets.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
      if (prevSet) setFilter.value = prevSet;

      function applyFilters() {
        const q = document.getElementById("search").value.trim().toLowerCase();
        const setVal = setFilter.value;
        const qual = document.getElementById("qualityFilter").value;
        let filtered = cards.slice();
        if (setVal) filtered = filtered.filter(c => c.set_name === setVal);
        if (qual === "watch") {
          filtered = filtered.filter(c => (c.floor_quality_flag || "").toLowerCase() === "watch");
        }
        if (q) {
          filtered = filtered.filter(c => {
            const blob = [c.card, c.number, c.set_name, c.scrape_query, c.advisor_decision]
              .join(" ").toLowerCase();
            return blob.includes(q);
          });
        }
        document.getElementById("stats").textContent =
          `Showing ${filtered.length} of ${cards.length}`;
        const list = document.getElementById("list");
        if (!filtered.length) {
          list.innerHTML = '<div class="empty">No cards match your filters.</div>';
          return;
        }
        list.innerHTML = filtered.map(card => {
          const qf = (card.floor_quality_flag || "").toLowerCase();
          const badgeClass = qf === "watch" ? "badge watch" : "badge";
          return `
            <article class="card">
              <h2>${escapeHtml(card.card || "")} <span style="color:var(--muted)">#${escapeHtml(card.number || "")}</span></h2>
              <p class="sub">${escapeHtml(card.set_name || "")} · ${escapeHtml(card.advisor_decision || "—")}</p>
              <div class="prices">
                <div class="price"><span class="label">Floor</span><span class="value">${money(card.floor_gbp)}</span></div>
                <div class="price"><span class="label">Target buy</span><span class="value">${money(card.target_buy_gbp)}</span></div>
              </div>
              <p>
                ${qf ? `<span class="${badgeClass}">${escapeHtml(card.floor_quality_flag)}</span>` : ""}
                ${card.floor_confidence ? `<span class="badge">${escapeHtml(card.floor_confidence)}</span>` : ""}
                ${card.ebay_sales != null ? `<span class="badge">${card.ebay_sales} eBay sold</span>` : ""}
              </p>
              <p class="why">${escapeHtml(card.floor_justification || card.card_show_price_note || "No floor note.")}</p>
            </article>
          `;
        }).join("");
      }

      document.getElementById("search").oninput = applyFilters;
      setFilter.onchange = applyFilters;
      document.getElementById("qualityFilter").onchange = applyFilters;
      applyFilters();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    loadSnapshot()
      .then(render)
      .catch(err => {
        document.getElementById("meta").textContent = "Could not load floors.json";
        document.getElementById("list").innerHTML =
          `<div class="error">${escapeHtml(err.message || err)}<br><br>Run the morning batch with <code>--export-static</code> on your laptop first.</div>`;
      });
  </script>
</body>
</html>
